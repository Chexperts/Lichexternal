# Lichexternal Configuration Template
#
# Default configuration search locations:
# - Linux:   $XDG_CONFIG_HOME/lichexternal/config.toml (~/.config/lichexternal/config.toml)
# - macOS:   ~/Library/Application Support/lichexternal/config.toml
# - Windows: %LOCALAPPDATA%\lichexternal\config.toml

[daemon]
# Local IPC socket/pipe path for lichexternal CLI communication
# Defaults:
# - Linux/macOS: $XDG_RUNTIME_DIR/lichexternal/lichexternald.sock (or /tmp/lichexternald-$UID.sock)
# - Windows:     \\.\pipe\lichexternald
# socket_path = "/run/user/1000/lichexternal/lichexternald.sock"

# Log level filter: "trace", "debug", "info", "warn", "error"
log_level = "info"

# Lichess User Personal Access Token (requires scopes: engine:read, engine:write)
# Can also be set via the LICHESS_API_TOKEN environment variable.
lichess_token = "YOUR_LICHESS_API_TOKEN"

# Base URL for Lichess REST API
# lichess_base_url = "https://lichess.org"

# Base URL for Lichess Engine Work Broker
# broker_base_url = "https://engine.lichess.ovh"

# ==============================================================================
# Engine Profiles
# ==============================================================================
# You can configure one or more engines. Each engine corresponds to an external
# engine registered on your Lichess account.
#
# Engine types:
# - "stdio":  Spawn a local executable binary and communicate via stdin/stdout.
# - "socket": Connect to a persistent local daemon exposing UCI over Unix domain
#             socket (Linux/macOS) or Named Pipe (Windows).
# ==============================================================================

# --- Example 1: Local Stockfish (Binary via Stdio) ---
[[engines]]
# Registered engine ID on Lichess (received during registration)
id = "stockfish-local"

# Provider secret generated by Lichess during engine registration
# Used to authenticate with engine.lichess.ovh
provider_secret = "your_provider_secret_here"

# Display name on Lichess
name = "Stockfish 19 (Local)"

# Engine communication backend: "stdio" or "socket"
type = "stdio"

# Command to execute (absolute path or binary in $PATH)
command = "/usr/bin/stockfish"

# Optional command-line arguments passed to the engine process
args = []

# Maximum threads and hash table size (in MiB) advertised to Lichess
max_threads = 16
max_hash = 4096

# Supported chess variants (e.g., ["chess", "antichess", "atomic", "crazyhouse"])
variants = ["chess"]

# Optional UCI options to initialize on startup
[engines.uci_options]
# "Threads" and "Hash" are dynamically set by Lichess work requests up to max_threads/max_hash.
# Custom static options can be declared here:
# SyzygyPath = "/data/chess/syzygy"


# --- Example 2: Chexpectimax / Maia (Persistent Daemon via Socket) ---
[[engines]]
id = "chexpectimax-local"
provider_secret = "another_provider_secret_here"
name = "Chexpectimax (Expectimax Maia 3)"
type = "socket"

# Path to the Unix Domain Socket (Linux/macOS) or Named Pipe (Windows: "\\\\.\\pipe\\chexpectimaxd")
socket = "/run/user/1000/chexpectimax.sock"

max_threads = 8
max_hash = 2048
variants = ["chess"]


# --- Example 3: Maia 3 (Direct Stdio / Python Wrapper) ---
[[engines]]
id = "maia3-local"
provider_secret = "maia_provider_secret_here"
name = "Maia 3 (1900 Elo)"
type = "stdio"
command = "python3"
args = ["-m", "maia", "--model", "maia_1900.onnx"]
max_threads = 4
max_hash = 1024
variants = ["chess"]
