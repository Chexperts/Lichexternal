name: "Deployment"

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    name: "Checks"
    uses: Malix-Labs/dotfiles/.github/workflows/check.yml@main

  publish-crates:
    name: "Publish to crates.io"
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Nix"
        uses: Malix-Labs/dotfiles/.github/actions/nix-setup@main
        with:
          reclaim: true

      - name: "Publish lichexternal-core"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop --command cargo publish -p lichexternal-core || echo "Crate version may already be published"

  publish-npm-and-assets:
    name: "Publish npm & Release Assets"
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Nix"
        uses: Malix-Labs/dotfiles/.github/actions/nix-setup@main
        with:
          reclaim: true

      - name: "Build TypeScript bindings"
        run: nix build .#typescript-bindings

      - name: "Upload TypeScript bindings artifact"
        uses: actions/upload-artifact@v7
        with:
          name: typescript-bindings
          path: result/

      - name: "Publish to npm (OIDC Trusted Publishing)"
        run: |
          cd result
          nix develop "$GITHUB_WORKSPACE" --command npm publish --provenance --access public

      - name: "Archive Release Assets"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf "lichexternal-typescript-bindings-${GITHUB_REF_NAME}.tar.gz" -C result .
          nix develop --command npm pack ./result

      - name: "Attach Release Assets"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lichexternal-typescript-bindings-*.tar.gz
            *.tgz
          generate_release_notes: true
