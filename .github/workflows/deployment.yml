name: "Deployment"

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-crates:
    name: "Publish to crates.io"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Publish lichexternal-core"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p lichexternal-core

  publish-npm-and-assets:
    name: "Publish npm & Release Assets"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/nix-installer-action@v16

      - name: "Set up Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: "Build TypeScript bindings"
        run: nix build .#typescript-bindings

      - name: "Upload TypeScript bindings artifact"
        uses: actions/upload-artifact@v4
        with:
          name: typescript-bindings
          path: result/

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: "Publish to npm (OIDC Trusted Publishing)"
        run: |
          cd result
          npm publish --provenance --access public
        continue-on-error: true

      - name: "Archive and Attach Release Assets"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "lichexternal-typescript-bindings-${GITHUB_REF_NAME}.tar.gz" -C result .
          npm pack ./result
          gh release upload "${GITHUB_REF_NAME}" "lichexternal-typescript-bindings-${GITHUB_REF_NAME}.tar.gz" ./*.tgz --clobber || true
