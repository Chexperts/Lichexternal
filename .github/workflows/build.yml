name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  toplevel:
    name: "Build Toplevel"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Malix-Labs/dotfiles/.github/actions/nix-setup@main
      - uses: Malix-Labs/dotfiles/.github/actions/nix-build@main
