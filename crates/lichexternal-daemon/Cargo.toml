[package]
name = "lichexternal-daemon"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lichexternald"
path = "src/main.rs"

[dependencies]
lichexternal-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
reqwest = { workspace = true, features = ["rustls-tls", "stream", "json"] }
futures-util = { workspace = true, features = ["std"] }
interprocess = { workspace = true, features = ["tokio"] }
etcetera = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
