[package]
name = "lichexternal-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lichexternal"
path = "src/main.rs"

[dependencies]
lichexternal-core = { workspace = true }
lichexternal-daemon = { path = "../lichexternal-daemon" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
clap = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
tabled = { workspace = true }
interprocess = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
anyhow = { workspace = true }
etcetera = { workspace = true }
toml = { workspace = true }
ring = "0.17"
base64 = "0.22"
