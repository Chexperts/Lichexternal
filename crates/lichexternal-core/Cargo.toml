[package]
name = "lichexternal-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core protocol models, UCI parsing, and schemas for Lichess External Engine bridges"
readme = "README.md"
documentation = "https://docs.rs/lichexternal-core"
keywords = ["chess", "lichess", "uci", "engine", "protocol"]
categories = ["games", "api-bindings", "parser-implementations", "no-std"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
memchr = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
etcetera = { workspace = true, optional = true }

[features]
default = ["std", "uci"]
std = ["serde/std", "dep:toml", "dep:etcetera"]
uci = ["dep:memchr"]
typescript = ["dep:ts-rs"]

[dependencies.ts-rs]
workspace = true
optional = true

[dev-dependencies]
serde_yaml = { workspace = true }
