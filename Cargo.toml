[workspace]
members = [
    "crates/lichexternal-core",
    "crates/lichexternal-daemon",
    "crates/lichexternal-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["Malix - Alix Brunet <alixbrunetcontact@gmail.com>"]
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Chexperts/Lichexternal"

[workspace.metadata.crane]
name = "lichexternal"

[workspace.metadata.release]
push = true
publish = false
tag = true
tag-name = "v{{version}}"
sign-commit = false
sign-tag = false
pre-release-commit-message = "chore(release): bump version to {{version}}"
tag-message = "Release {{version}}"

[workspace.dependencies]
# Internal workspace crates
lichexternal-core = { path = "crates/lichexternal-core" }

# Serialization & Models
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
memchr = { version = "2.7", default-features = false }

# Async runtime & networking (Daemon & CLI)
tokio = { version = "1.40", default-features = false }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.12", default-features = false }
futures-util = { version = "0.3", default-features = false }

# Cross-platform IPC, paths & CLI
interprocess = { version = "2.2", default-features = false }
etcetera = "0.8"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
anstyle = "1.0"
anstream = "0.6"
tabled = { version = "0.17", default-features = false, features = ["derive", "std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
anyhow = "1.0"
open = "5.3"
oauth2 = { version = "4.4", default-features = false, features = ["reqwest", "rustls-tls"] }
url = { version = "2.5", default-features = false }

# Optional TypeScript type export
ts-rs = "10.0"

# Dev & testing
wiremock = "0.6"
tempfile = "3.12"
serde_yaml = "0.9"
